name: dope_wars_atl
description: "Dope Wars - Atlanta. A drug trade empire game set in Atlanta."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  audioplayers: ^6.4.0
  flame: ^1.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ads/
    - assets/sounds/
    - assets/images/
